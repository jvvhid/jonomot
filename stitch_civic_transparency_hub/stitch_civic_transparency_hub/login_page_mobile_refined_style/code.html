<body class="h-full font-body-md text-on-background bg-white overflow-y-auto">
<!-- Mobile Login Screen Container -->
<main class="relative min-h-screen w-full flex flex-col items-center justify-center py-12">
<!-- Background Watermark -->
<div class="fixed inset-0 z-0 pointer-events-none">
<div class="w-full h-full bg-cover bg-center bg-no-repeat opacity-[0.08]" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBK8VJy-iWNhabG7Dj4HIdO8pVWVaRB_uVNiBkOTFRlgf2LFZylcCljfyFV0Dc2WnfszUWjDQyiRwvGqzxod1O-iN37i38gyRTcdsV_Fp1WMD504BVLoiZ-YoB9HmyX0lBsjDSrHEfYWc4SyH46TvBxHPE-khO-nGS_WxBB6D_L62Ijffahs3XHA--Xsjurcmq5Il68bTRvssY-Ji2wGWDMK_ITYf1Ajqs0ThGyvsXIQ8c-YgX8hQ_5bgV8Bi9rKJFPVq8IRb53suQ');"></div>
</div>
<!-- Logo Section Above Card -->
<div class="relative z-10 text-center mb-8">
<div class="flex items-center justify-center gap-2 mb-1"><img src="https://lh3.googleusercontent.com/aida-public/AB6AXuDemPhKRDTPiZSdMbOA71Irk4qKFHd2mSOoKOjS8zMWrtYUT9QaY3qVwV0n_vophtxphRWIsuHEPzthBc_j7fEyhDLIMcord4kzgS1hUiaBplYExBfmdtbSMoYu3vjItaW7k2lL1AfKWUbdh1fdXERXFSi1Cfz0wCBL9O-LWe1_FAcZxMWiPdppWvPGD3fd6yZq4EQkuDgL77_4jpSWcv4nUwRP4aaXKFuHNU3rC3uqw_zJjWwL8mxWX2L0TNhwvsQtwWodROE9w0o" alt="Jonomot Official Logo" class="h-12 w-auto object-contain"></div>
<p class="text-xs text-on-surface-variant font-medium">জনতার মত জনতার জন্য</p>
</div>
<!-- Login Card Container -->
<div class="relative z-10 w-full max-w-md px-6">
<div class="bg-white rounded-2xl p-8 shadow-xl flex flex-col gap-6">
<!-- Welcome Header -->
<div class="text-center mb-2">
<h2 class="text-2xl font-bold text-gray-800 mb-1">স্বাগতম!</h2>
<p class="text-sm text-gray-500">আপনার অ্যাকাউন্টে লগইন করুন</p>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-5" onsubmit="return false;">
<!-- Email/Phone Number Field -->
<div class="space-y-1.5">
<label class="text-sm text-gray-700 font-medium" for="phone">ফোন নম্বর</label>
<div class="relative group">
<span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 material-symbols-outlined text-[20px]">person</span>
<input class="w-full h-11 pl-10 pr-4 rounded-lg border border-gray-200 bg-white text-gray-800 focus:ring-1 focus:ring-primary-container focus:border-primary-container transition-all placeholder:text-gray-400 text-sm outline-none" id="phone" name="phone" placeholder="আপনার ফোন নম্বর লিখুন" type="text">
</div>
</div>
<!-- Password Field -->
<div class="space-y-1.5">
<label class="text-sm text-gray-700 font-medium" for="password">
                                পাসওয়ার্ড
                            </label>
<div class="relative group">
<span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 material-symbols-outlined text-[20px]">lock</span>
<input class="w-full h-11 pl-10 pr-10 rounded-lg border border-gray-200 bg-white text-gray-800 focus:ring-1 focus:ring-primary-container focus:border-primary-container transition-all placeholder:text-gray-400 text-sm outline-none" id="password" name="password" placeholder="পাসওয়ার্ড লিখুন" type="password">
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
<div class="flex justify-end pt-1">
<a class="text-sm text-primary-container font-medium hover:underline" href="#">পাসওয়ার্ড ভুলেছেন?</a>
</div>
</div>
<!-- Action Button -->
<div class="pt-2">
<button class="w-full h-11 bg-[#064e3b] text-white font-medium rounded-lg hover:bg-opacity-90 active:scale-[0.98] transition-all flex items-center justify-center text-base" type="submit">
                            লগইন করুন
</button>
</div>
</form>
<!-- Divider -->

<!-- Social Login Buttons -->

<!-- Footer Links -->
<div class="mt-4 text-center">
<p class="text-sm text-gray-600">
                        অ্যাকাউন্ট নেই? 
                        <a class="text-primary-container font-medium hover:underline" href="#">রেজিস্টার করুন</a>
</p>
</div>
</div>
</div>
</main>
<script>
        // Micro-interaction for input fields
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('scale-[1.01]');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('scale-[1.01]');
            });
        });

        // Simple visibility toggle logic
        const togglePass = document.querySelector('button[type="button"]');
        const passInput = document.querySelector('#password');
        togglePass?.addEventListener('click', () => {
            const isPassword = passInput.type === 'password';
            passInput.type = isPassword ? 'text' : 'password';
            togglePass.querySelector('span').textContent = isPassword ? 'visibility_off' : 'visibility';
        });
    </script>


</body></html>
