<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Jonomot - Submit Report</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary-fixed": "#b0f0d6",
                        "surface-container": "#e6eeff",
                        "surface-bright": "#f9f9ff",
                        "on-tertiary-fixed-variant": "#454748",
                        "on-secondary": "#ffffff",
                        "tertiary": "#2c2f30",
                        "surface": "#f9f9ff",
                        "on-tertiary-container": "#b0b2b3",
                        "on-primary-container": "#80bea6",
                        "background": "#f9f9ff",
                        "surface-tint": "#2b6954",
                        "error": "#ba1a1a",
                        "surface-container-highest": "#d9e3f7",
                        "on-secondary-fixed-variant": "#920029",
                        "on-surface": "#121c2a",
                        "outline": "#707974",
                        "on-error": "#ffffff",
                        "inverse-surface": "#273140",
                        "on-surface-variant": "#404944",
                        "tertiary-container": "#424546",
                        "on-primary-fixed": "#002117",
                        "outline-variant": "#bfc9c3",
                        "on-error-container": "#93000a",
                        "secondary-fixed": "#ffdadb",
                        "on-secondary-fixed": "#40000d",
                        "surface-dim": "#d0daef",
                        "primary-container": "#064e3b",
                        "tertiary-fixed": "#e1e3e4",
                        "surface-variant": "#d9e3f7",
                        "on-tertiary-fixed": "#191c1d",
                        "primary-fixed-dim": "#95d3ba",
                        "tertiary-fixed-dim": "#c5c7c8",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed-dim": "#ffb2b7",
                        "on-tertiary": "#ffffff",
                        "surface-container-low": "#eff3ff",
                        "error-container": "#ffdad6",
                        "secondary-container": "#db2e4e",
                        "surface-container-high": "#dee9fd",
                        "secondary": "#b80938",
                        "on-secondary-container": "#fffbff",
                        "inverse-on-surface": "#ebf1ff",
                        "primary": "#003527",
                        "on-background": "#121c2a",
                        "inverse-primary": "#95d3ba",
                        "on-primary": "#ffffff",
                        "on-primary-fixed-variant": "#0b513d"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "stack-sm": "0.5rem",
                        "gutter-grid": "1.5rem",
                        "margin-page": "2rem",
                        "stack-md": "1rem",
                        "stack-lg": "2rem"
                    },
                    fontFamily: {
                        "label-sm": ["Hanken Grotesk"],
                        "headline-xl": ["Hanken Grotesk"],
                        "body-lg": ["Hanken Grotesk"],
                        "body-md": ["Hanken Grotesk"],
                        "headline-md": ["Hanken Grotesk"],
                        "headline-lg": ["Hanken Grotesk"]
                    },
                    fontSize: {
                        "label-sm": ["14px", { lineHeight: "20px", fontWeight: "500" }],
                        "headline-xl": ["40px", { lineHeight: "48px", letterSpacing: "-0.02em", fontWeight: "700" }],
                        "body-lg": ["18px", { lineHeight: "28px", fontWeight: "400" }],
                        "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
                        "headline-md": ["24px", { lineHeight: "32px", fontWeight: "600" }],
                        "headline-lg": ["32px", { lineHeight: "40px", fontWeight: "700" }]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Hanken Grotesk', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- Top Navigation (Transactional View - Hidden BottomNavBar) -->
<header class="sticky top-0 z-50 flex justify-between items-center w-full px-4 md:px-margin-page h-16 bg-surface/95 backdrop-blur-sm border-b border-outline-variant">
<div class="flex items-center gap-4">
<button class="text-on-surface-variant hover:bg-surface-container rounded-full p-2 transition-colors">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<span class="text-headline-md font-headline-md text-primary">Report Details</span>
</div>
<button class="text-label-sm font-label-sm text-on-surface-variant hover:text-primary transition-colors">Save Draft</button>
</header>
<!-- Progress Bar -->
<div class="w-full h-1 bg-surface-container-highest">
<div class="h-full bg-primary w-1/2 transition-all duration-300"></div>
</div>
<!-- Main Content Area -->
<main class="flex-grow p-4 max-w-md mx-auto w-full flex flex-col gap-6">
<div class="space-y-1">
<h1 class="text-headline-md font-headline-md text-on-surface">Step 2: Evidence &amp; Details</h1>
<p class="text-body-md font-body-md text-on-surface-variant">Provide specific information about your experience.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-6">
<!-- Institution Search/Select -->
<div class="space-y-2">
<label class="text-label-sm font-label-sm text-on-surface block">Institution</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-3 text-outline" data-icon="search">search</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface border border-outline-variant rounded-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all text-body-md font-body-md text-on-surface placeholder:text-outline" placeholder="Search government offices..." type="text"/>
</div>
<!-- Suggested Chips -->
<div class="flex gap-2 mt-2 overflow-x-auto pb-1 hide-scrollbar">
<button class="px-3 py-1.5 bg-surface-container-low border border-outline-variant rounded-full text-label-sm font-label-sm text-on-surface-variant whitespace-nowrap hover:bg-surface-container transition-colors" type="button">Dhaka City Corp</button>
<button class="px-3 py-1.5 bg-surface-container-low border border-outline-variant rounded-full text-label-sm font-label-sm text-on-surface-variant whitespace-nowrap hover:bg-surface-container transition-colors" type="button">BRTA Mirpur</button>
</div>
</div>
<!-- Date Picker -->
<div class="space-y-2">
<label class="text-label-sm font-label-sm text-on-surface block">Date of Incident</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-3 text-outline" data-icon="calendar_today">calendar_today</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface border border-outline-variant rounded-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all text-body-md font-body-md text-on-surface" type="date"/>
</div>
</div>
<!-- Description Area -->
<div class="space-y-2">
<label class="text-label-sm font-label-sm text-on-surface block">Description</label>
<textarea class="w-full p-4 bg-surface border border-outline-variant rounded-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all text-body-md font-body-md text-on-surface placeholder:text-outline resize-none" placeholder="Describe what happened in detail..." rows="4"></textarea>
<p class="text-[12px] text-on-surface-variant text-right">0 / 500</p>
</div>
<!-- Mobile Optimized Image Upload -->
<div class="space-y-2">
<label class="text-label-sm font-label-sm text-on-surface block flex justify-between items-center">
<span>Evidence (Photos/Documents)</span>
<span class="text-[12px] text-on-surface-variant">Optional</span>
</label>
<div class="grid grid-cols-3 gap-2">
<!-- Upload Button -->
<label class="aspect-square flex flex-col items-center justify-center bg-surface-container-low border-2 border-dashed border-outline-variant rounded-lg cursor-pointer hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-primary mb-1" data-icon="add_a_photo">add_a_photo</span>
<span class="text-[10px] text-on-surface-variant font-medium">Add Photo</span>
<input accept="image/*" class="hidden" multiple="" type="file"/>
</label>
<!-- Placeholder Thumbnails (Simulating uploaded images) -->
<div class="aspect-square rounded-lg overflow-hidden relative group">
<div class="w-full h-full bg-surface-variant flex items-center justify-center">
<span class="material-symbols-outlined text-outline" data-icon="image">image</span>
</div>
<button class="absolute top-1 right-1 bg-tertiary/70 text-on-secondary rounded-full p-1 opacity-0 group-hover:opacity-100 transition-opacity" type="button">
<span class="material-symbols-outlined text-[16px]" data-icon="close">close</span>
</button>
</div>
</div>
</div>
</form>
</main>
<!-- Bottom Action Area (Sticky) -->
<div class="sticky bottom-0 p-4 bg-surface border-t border-outline-variant mt-auto">
<button class="w-full py-4 bg-primary-container text-on-primary-container text-body-md font-body-md font-bold rounded-lg shadow-sm hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
            Submit Report
            <span class="material-symbols-outlined" data-icon="send">send</span>
</button>
</div>
<style>
        /* Hide scrollbar for horizontal scrolling chips */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</body></html>
