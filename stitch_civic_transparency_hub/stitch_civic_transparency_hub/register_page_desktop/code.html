<body class="font-body-md text-body-md bg-background text-on-background min-h-screen flex flex-col">

<img src="https://lh3.googleusercontent.com/aida-public/AB6AXuDemPhKRDTPiZSdMbOA71Irk4qKFHd2mSOoKOjS8zMWrtYUT9QaY3qVwV0n_vophtxphRWIsuHEPzthBc_j7fEyhDLIMcord4kzgS1hUiaBplYExBfmdtbSMoYu3vjItaW7k2lL1AfKWUbdh1fdXERXFSi1Cfz0wCBL9O-LWe1_FAcZxMWiPdppWvPGD3fd6yZq4EQkuDgL77_4jpSWcv4nUwRP4aaXKFuHNU3rC3uqw_zJjWwL8mxWX2L0TNhwvsQtwWodROE9w0o" alt="Jonomot Official Logo" class="h-12 w-auto mb-2">
<p class="font-label-sm text-label-sm text-on-surface-variant text-center">একটি স্বচ্ছ এবং জবাবদিহিতামূলক নাগরিক প্ল্যাটফর্ম</p>
</div>
<!-- Registration Form -->
<form class="flex flex-col gap-stack-md" id="registrationForm" onsubmit="handleRegister(event)">
<!-- Name Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="name">নাম</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline">person</span>
<input class="w-full pl-10 pr-4 py-3 bg-white border border-outline-variant rounded-lg focus:outline-none focus:border-primary-container transition-all" id="name" placeholder="আপনার পূর্ণ নাম লিখুন" required="" type="text">
</div>
</div>
<!-- Phone Number with Action -->
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="phone">ফোন নম্বর</label>
<div class="flex gap-2">
<div class="relative flex-grow flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline">call</span>
<input class="w-full pl-10 pr-4 py-3 bg-white border border-outline-variant rounded-lg focus:outline-none focus:border-primary-container transition-all" id="phone" placeholder="০১৭XXXXXXXX" required="" type="tel">
</div>
<button class="px-4 py-3 bg-secondary text-on-secondary font-label-sm text-label-sm rounded-lg hover:opacity-90 active:scale-95 transition-all whitespace-nowrap" onclick="sendCode()" type="button">
                                কোড পাঠান
                            </button>
</div>
</div>
<!-- Verification Code -->
<div class="flex flex-col gap-1.5" id="otpSection">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="otp">ভেরিফিকেশন কোড</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline">verified_user</span>
<input class="w-full pl-10 pr-4 py-3 bg-white border border-outline-variant rounded-lg focus:outline-none focus:border-primary-container transition-all" id="otp" placeholder="৬ ডিজিটের কোডটি দিন" type="text">
</div>
</div>
<!-- Password Fields -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-3">
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="password">পাসওয়ার্ড</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline">lock</span>
<input class="w-full pl-10 pr-4 py-3 bg-white border border-outline-variant rounded-lg focus:outline-none focus:border-primary-container transition-all" id="password" placeholder="পাসওয়ার্ড" required="" type="password">
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="confirm_password">পাসওয়ার্ড নিশ্চিত করুন</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline">lock_reset</span>
<input class="w-full pl-10 pr-4 py-3 bg-white border border-outline-variant rounded-lg focus:outline-none focus:border-primary-container transition-all" id="confirm_password" placeholder="আবার লিখুন" required="" type="password">
</div>
</div>
</div>
<!-- Primary Action -->
<button class="w-full py-4 mt-stack-sm bg-primary-container text-on-primary font-headline-md text-headline-md rounded-lg shadow-md hover:bg-on-primary-fixed-variant active:scale-[0.98] transition-all duration-150" type="submit">
                        রেজিস্টার করুন
                    </button>
</form>
<!-- Divider -->
<div class="flex items-center gap-4 my-2">
<div class="flex-grow h-px bg-outline-variant"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant">অথবা</span>
<div class="flex-grow h-px bg-outline-variant"></div>
</div>
<!-- OAuth Options -->
<div class="flex flex-col gap-3">
<button class="w-full flex items-center justify-center gap-3 py-3 border border-outline-variant rounded-lg hover:bg-surface-container-low transition-colors">
<svg class="w-5 h-5" viewBox="0 0 24 24">

<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="font-label-sm text-label-sm">গুগল দিয়ে সাইন আপ করুন</span>
</button>
<button class="w-full flex items-center justify-center gap-3 py-3 border border-outline-variant rounded-lg hover:bg-surface-container-low transition-colors">
<svg class="w-5 h-5" fill="#1877F2" viewBox="0 0 24 24">
<path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"></path>
</svg>
<span class="font-label-sm text-label-sm">ফেসবুক দিয়ে সাইন আপ করুন</span>
</button>

<!-- Redirect to Login -->
<p class="mt-4 text-center font-label-sm text-label-sm text-on-surface-variant">
                    ইতিমধ্যে একাউন্ট আছে? <a class="text-primary font-bold hover:underline" href="#">লগইন করুন</a>

<p class="font-label-sm text-label-sm text-on-surface-variant">© ২০২৪ জনমত সার্ভিস ট্রান্সপারেন্সি প্ল্যাটফর্ম</p>
<div class="flex gap-margin-page">
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors" href="#">সহায়তা</a>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors" href="#">গোপনীয়তা নীতি</a>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors" href="#">ব্যবহারের শর্তাবলী</a>
</div>

<script>
        function sendCode() {
            const phone = document.getElementById('phone').value;
            if(!phone) {
                alert('অনুগ্রহ করে আগে আপনার ফোন নম্বর দিন।');
                return;
            }
            // Mock interaction
            alert('আপনার নম্বরে একটি ৬ ডিজিটের কোড পাঠানো হয়েছে।');
            document.getElementById('otp').focus();
        }

        function handleRegister(event) {
            event.preventDefault();
            
            // Basic validation check for password match
            const pass = document.getElementById('password').value;
            const confirmPass = document.getElementById('confirm_password').value;
            
            if(pass !== confirmPass) {
                alert('পাসওয়ার্ড মিলছে না। আবার চেষ্টা করুন।');
                return;
            }

            // Mock success and redirect
            const btn = event.target.querySelector('button[type="submit"]');
            btn.innerHTML = '<span class="flex items-center justify-center gap-2"><svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> প্রসেসিং...</span>';
            btn.disabled = true;

            setTimeout(() => {
                // In a real app, this would redirect to '/' or '/home'
                alert('রেজিস্ট্রেশন সফল হয়েছে! আপনাকে ড্যাশবোর্ডে নিয়ে যাওয়া হচ্ছে।');
                window.location.reload(); 
            }, 1500);
        }

        // Add subtle animation to background elements
        document.addEventListener('mousemove', (e) => {
            const mural = document.querySelector('.bg-cover');
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            mural.style.transform = `scale(1.05) translate(${x * 10}px, ${y * 10}px)`;
        });
    </script>
