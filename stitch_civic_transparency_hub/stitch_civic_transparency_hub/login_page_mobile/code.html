<body class="h-full font-body-md text-on-background bg-background overflow-hidden">
<!-- Mobile Login Screen Container -->

<p class="font-label-sm-mobile text-label-sm-mobile text-on-surface-variant uppercase tracking-widest">Citizen Portal Login</p>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-6" onsubmit="return false;">
<!-- Phone Number Field -->
<div class="space-y-2">
<label class="font-label-sm-mobile text-label-sm-mobile text-on-surface-variant flex items-center gap-2" for="phone">
<span class="material-symbols-outlined text-[18px]">call</span>

<div class="relative group">
<input class="w-full h-12 px-4 rounded-lg border border-outline-variant bg-white/50 text-on-surface focus:ring-2 focus:ring-primary focus:border-primary transition-all placeholder:text-outline/50 font-body-md-mobile text-body-md-mobile outline-none" id="phone" name="phone" placeholder="01XXXXXXXXX" type="tel">
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="font-label-sm-mobile text-label-sm-mobile text-on-surface-variant flex items-center gap-2" for="password">
<span class="material-symbols-outlined text-[18px]">lock</span>
                                পাসওয়ার্ড (Password)
                            </label>
<a class="font-label-sm-mobile text-label-sm-mobile text-primary-container font-semibold hover:underline" href="#">বিস্মৃত পাসওয়ার্ড?</a>

<div class="relative group">
<input class="w-full h-12 px-4 rounded-lg border border-outline-variant bg-white/50 text-on-surface focus:ring-2 focus:ring-primary focus:border-primary transition-all placeholder:text-outline/50 font-body-md-mobile text-body-md-mobile outline-none" id="password" name="password" placeholder="••••••••" type="password">

<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Action Button -->

</button>

<script>
        // Micro-interaction for input fields
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('scale-[1.01]');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('scale-[1.01]');
            });
        });

        // Simple visibility toggle logic
        const togglePass = document.querySelector('button[type="button"]');
        const passInput = document.querySelector('#password');
        togglePass?.addEventListener('click', () => {
            const isPassword = passInput.type === 'password';
            passInput.type = isPassword ? 'text' : 'password';
            togglePass.querySelector('span').textContent = isPassword ? 'visibility_off' : 'visibility';
        });
    </script>
