<body class="bg-background text-on-background antialiased flex">
<!-- Intent implies transactional flow (report submission), hiding global nav shell to prioritize canvas -->
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-[1280px] mx-auto min-h-screen px-4 py-8 md:px-margin-page md:py-12">
<!-- Header & Progress -->
<header class="mb-12 max-w-4xl mx-auto flex flex-col md:flex-row md:items-center md:justify-between gap-6">
<div>
<a class="inline-flex items-center text-primary mb-6 hover:opacity-80 transition-opacity" href="#">
<span class="material-symbols-outlined mr-2">arrow_back</span>
<span class="font-label-sm text-label-sm">Back to Dashboard</span>
</a>
<h1 class="font-headline-xl text-headline-xl text-on-surface mb-2">Share Your Experience</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Help improve public services by reporting your encounter.</p>
</div>
<div class="flex flex-col items-start md:items-end w-full md:w-auto">
<div class="flex items-center gap-2 mb-2">
<span class="font-label-sm text-label-sm text-primary">Step 1 of 3</span>
<span class="font-label-sm text-label-sm text-on-surface-variant"> - Category</span>
</div>
<div class="w-full md:w-48 h-2 bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full" style="width: 33%;"></div>
</div>
</div>
</header>
<!-- Form Step 1: Category Selection -->
<section class="max-w-4xl mx-auto">
<h2 class="font-headline-md text-headline-md text-on-surface mb-6">Select an issue category</h2>
<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
<!-- Category Card 1 -->
<button class="group relative flex flex-col items-center justify-center p-8 bg-surface-container-lowest rounded-xl border border-outline-variant hover:border-primary hover:shadow-[0px_4px_12px_rgba(0,0,0,0.05)] transition-all text-center h-48 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" type="button">
<div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center mb-4 group-hover:bg-primary-container transition-colors">
<span class="material-symbols-outlined text-4xl text-on-surface-variant group-hover:text-on-primary-container">campaign</span>
</div>
<span class="font-headline-md text-body-lg text-on-surface group-hover:text-primary transition-colors">Harassment</span>
</button>
<!-- Category Card 2 -->
<button class="group relative flex flex-col items-center justify-center p-8 bg-surface-container-lowest rounded-xl border border-outline-variant hover:border-primary hover:shadow-[0px_4px_12px_rgba(0,0,0,0.05)] transition-all text-center h-48 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" type="button">
<div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center mb-4 group-hover:bg-primary-container transition-colors">
<span class="material-symbols-outlined text-4xl text-on-surface-variant group-hover:text-on-primary-container">money_off</span>
</div>
<span class="font-headline-md text-body-lg text-on-surface group-hover:text-primary transition-colors">Bribery</span>
</button>

<div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center mb-4 group-hover:bg-primary-container transition-colors">
<span class="material-symbols-outlined text-4xl text-on-surface-variant group-hover:text-on-primary-container">gavel</span>
</div>
<span class="font-headline-md text-body-lg text-on-surface group-hover:text-primary transition-colors">Corruption</span>
</button>
<!-- Category Card 4 -->
<button class="group relative flex flex-col items-center justify-center p-8 bg-surface-container-lowest rounded-xl border border-outline-variant hover:border-primary hover:shadow-[0px_4px_12px_rgba(0,0,0,0.05)] transition-all text-center h-48 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" type="button">
<div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center mb-4 group-hover:bg-primary-container transition-colors">
<span class="material-symbols-outlined text-4xl text-on-surface-variant group-hover:text-on-primary-container">sentiment_dissatisfied</span>
</div>
<span class="font-headline-md text-body-lg text-on-surface group-hover:text-primary transition-colors">Poor Service</span>

<div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center mb-4 group-hover:bg-primary-container transition-colors">
<span class="material-symbols-outlined text-4xl text-on-surface-variant group-hover:text-on-primary-container">more_horiz</span>
</div>
<span class="font-headline-md text-body-lg text-on-surface group-hover:text-primary transition-colors">Other Issue</span>
